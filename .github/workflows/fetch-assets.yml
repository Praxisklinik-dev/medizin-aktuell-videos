name: Bilder-Clips-holen

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/requests.json"

permissions:
  contents: write

concurrency:
  group: fetch-assets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Holen
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python upload/fetch_assets.py
      - name: Speichern
        run: |
          git config user.name "medizin-aktuell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || (git commit -m "Assets: Bilder/Clips geholt" && git pull --rebase && git push)
