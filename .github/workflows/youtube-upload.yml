name: YouTube-Upload

on:
  schedule:
    - cron: "17,47 * * * *"   # alle 30 Minuten
  workflow_dispatch:
  push:
    paths:
      - "upload/queue.json"

permissions:
  contents: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-api-python-client google-auth
      - name: Hochladen und Kommentare setzen
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python upload/yt_upload.py
      - name: Status speichern
        run: |
          git config user.name "medizin-aktuell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add upload/state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "YouTube-Upload: Status aktualisiert" && git pull --rebase && git push)
