name: Facebook-Instagram

on:
  schedule:
    - cron: "5,35 * * * *"   # alle 30 Minuten
  workflow_dispatch:
  push:
    paths:
      - "social/queue.json"

permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Posten
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: python upload/meta_post.py
      - name: Status speichern
        run: |
          git config user.name "medizin-aktuell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add social/state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Social: Status aktualisiert" && git pull --rebase && git push)
